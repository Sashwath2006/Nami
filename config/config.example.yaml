# Copy to config/config.yaml (git-ignored). NEVER put API keys here; Hermes keeps secrets in its own .env.
jarvis:
  hermes_profile: jarvis
  privacy:
    allow_cloud: false          # local only: no source/private data leaves this machine
  model:
    provider: custom            # local OpenAI-compatible endpoint (e.g. Ollama)
    endpoint: http://127.0.0.1:11434/v1
    name: ""                    # set after choosing a model; context must be >= 64K
  voice:
    wake_word: { provider: sherpa, phrase: "hey nami", sensitivity: 0.6 }
    stt: local
    tts: edge                   # NOTE: Edge TTS is a cloud service; switch to piper/neutts if text must stay local
  execution:
    terminal_backend: docker
    approvals_mode: manual
    deny:
      - "git push --force*"
      - "*curl*|*sh*"
      - "sudo *"
      - "rm -rf *"
  projects: []                  # registered via jarvis, e.g. {name, root, test_cmd}
  secret_globs: [".env", ".env.*", "*.pem", "*.key", "id_rsa*", ".aws/*", ".ssh/*"]
