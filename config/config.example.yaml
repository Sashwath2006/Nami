# Copy to config/config.yaml (git-ignored). NEVER put API keys here; Hermes keeps secrets in its own .env.
nami:
  hermes_profile: nami
  privacy:
    allow_cloud: false          # local only: no source/private data leaves this machine
  model:
    provider: custom            # local OpenAI-compatible endpoint (e.g. Ollama)
    endpoint: http://127.0.0.1:11434/v1
    name: ""                    # set after choosing a model; context must be >= 64K
  voice:
    wake_word: { provider: sherpa, phrase: "hey nami", sensitivity: 0.6 }
    stt: local
    tts: edge                   # NOTE: Edge TTS is a cloud service; switch to piper/neutts if text must stay local
  execution:
    terminal_backend: docker
    approvals_mode: manual
    deny:
      - "git push --force*"
      - "*curl*|*sh*"
      - "sudo *"
      - "rm -rf *"
  routing:
    allow_cloud: false          # master switch; flip to true only after reading docs/model-routing.md
    cloud_confirm_internal: true
    local_profile: nami-local
    cloud_profile: nami-cloud
    local_context_limit: 64000  # set to your local model's real window
    treat_pii_as_sensitive: true
    aliases:                    # must exist as model_aliases in the matching Hermes profile
      local_fast: local-fast
      local_strong: local-strong
      cloud_fast: cloud-fast
      cloud_strong: cloud-strong
  projects: []                  # {name, root, test_cmd, sensitivity: public|internal|sensitive}; default = sensitive
  secret_globs: [".env", ".env.*", "*.pem", "*.key", "id_rsa*", ".aws/*", ".ssh/*"]
